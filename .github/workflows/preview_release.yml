
name: Preview Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"

  workflow_dispatch:

jobs:
  upload-release:
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name != 'pull_request') }}
    runs-on: ubuntu-22.04
    needs: [build-mac, build-mac-arm, build-linux, build-windows, build-windows-arm64]
    # creating a release needs write access; the default GITHUB_TOKEN is read-only
    permissions:
      contents: write

    steps:
    - name: download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: compute checksums
      working-directory: artifacts
      run: |
        find . -type f \( -name 'sioyek-release-*.zip' -o -name 'sioyek-setup-*.exe' \) -print0 \
          | xargs -0 sha256sum | sed 's#  .*/#  #' | sort -k2 > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: create release
      uses: softprops/action-gh-release@v2
      with:
        # tag pushes release under their tag; manual runs get a tag of their own
        tag_name: preview-${{ github.run_number }}
        target_commitish: ${{ github.sha }}
        name: Release ${{ github.sha }}
        prerelease: true
        fail_on_unmatched_files: true
        files: |
          artifacts/mac-uploads/sioyek-release-mac.zip
          artifacts/mac-arm-uploads/sioyek-release-mac-arm.zip
          artifacts/linux-uploads/sioyek-release-linux.zip
          artifacts/windows-uploads/sioyek-release-windows.zip
          artifacts/windows-arm64-standard-uploads/sioyek-release-windows-arm64.zip
          artifacts/windows-arm64-standard-uploads/sioyek-setup-windows-arm64.exe
          artifacts/windows-arm64-portable-uploads/sioyek-release-windows-arm64-portable.zip
          artifacts/SHA256SUMS.txt

  build-linux:

    runs-on: ubuntu-22.04

    steps:
    - name: Cache apt-get packages
      uses: actions/cache@v4
      env:
        cache-name: cache-deb-packages
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install LinuxDeploy
      uses: miurahr/install-linuxdeploy-action@v1
      with:
        plugins: qt appimage

    - name: Set up GCC
      uses: egor-tensin/setup-gcc@v1
      with:
        version: 11
        platform: x64

    - uses: actions/checkout@v4
      with:
            submodules: 'recursive'
            ref: development

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev libxrandr-dev libxi-dev libglu1-mesa-dev libfuse2 libxcb-cursor0 libspeechd2
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        modules: 'all'
        cache: true

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}

      run: MAKE_PARALLEL=$(nproc) ./linuxdeploy_build_and_release.sh
      env:
        CC:   gcc-11
        CXX:  g++-11
    - name: upload linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-uploads
        path: sioyek-release-linux.zip
    - name: Workaround apt-get cache permission (https://github.com/actions/cache/issues/324)
      run: |
        export USER_NAME=$(whoami)
        sudo chown -R $USER_NAME /var/cache/apt/archives

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
            submodules: 'recursive'
            ref: development
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        modules: 'all'
        cache: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Add msvc-dev-cmd
      uses: ilammy/msvc-dev-cmd@v1
      
      
    - name: Build Sioyek
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: .\build_windows.bat non_portable
      
    - name: upload windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-uploads
        path: sioyek-release-windows.zip
        
  build-windows-arm64:

    runs-on: windows-11-arm

    strategy:
      matrix:
        # standard: zip + installer, portable: zip that keeps its config and database next to sioyek.exe
        variant: [standard, portable]

    env:
      # optional code signing: a base64-encoded .pfx certificate and its password
      SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      SIOYEK_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
    - uses: actions/checkout@v4
      with:
            submodules: 'recursive'
            ref: development

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.12.0'
        host: 'windows_arm64'
        target: 'desktop'
        arch: 'win64_msvc2022_arm64'
        modules: 'qtspeech qtmultimedia'
        cache: true

    - name: Install Inno Setup
      if: matrix.variant == 'standard'
      shell: pwsh
      run: |
        if (Get-Command choco -ErrorAction SilentlyContinue) {
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
        }
        else {
          Invoke-WebRequest https://jrsoftware.org/download.php/is.exe -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          Start-Process "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER' -Wait
        }

    - name: Prepare code signing certificate
      if: env.SIGNING_CERTIFICATE != ''
      shell: pwsh
      run: |
        $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
        [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
        "SIOYEK_SIGN_CERT_PATH=$path" >> $env:GITHUB_ENV

    - name: Build Sioyek
      working-directory: ${{env.GITHUB_WORKSPACE}}
      shell: pwsh
      run: |
        $params = @{ QtDir = $env:QT_ROOT_DIR }
        if ('${{ matrix.variant }}' -eq 'portable') { $params.Portable = $true } else { $params.Installer = $true }
        if ($env:SIOYEK_SIGN_CERT_PATH) { $params.CertificatePath = $env:SIOYEK_SIGN_CERT_PATH }
        ./build_windows_arm64.ps1 @params

    - name: Remove code signing certificate
      if: always() && env.SIOYEK_SIGN_CERT_PATH != ''
      shell: pwsh
      run: Remove-Item -Force $env:SIOYEK_SIGN_CERT_PATH

    - name: Smoke test
      shell: pwsh
      run: ./scripts/smoke_test_windows.ps1 -PackageDir sioyek-release-windows-arm64

    # the runner has no GPU, so a failure here may be the runner's OpenGL support rather than sioyek
    - name: Smoke test (open a document)
      continue-on-error: true
      shell: pwsh
      run: ./scripts/smoke_test_windows.ps1 -PackageDir sioyek-release-windows-arm64 -LaunchGui

    - name: upload windows arm64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-${{ matrix.variant }}-uploads
        path: |
          sioyek-release-windows-arm64*.zip
          sioyek-setup-windows-arm64.exe
        if-no-files-found: error

  build-mac:

    runs-on: macos-15-intel

    steps:

    - uses: actions/checkout@v4
      with:
            submodules: 'recursive'
            ref: development

    - name: Cache Homebrew packages
      uses: actions/cache@v4
      env:
        cache-name: homebrew
      with:
        path: ~/Library/Caches/Homebrew
        key: ${{ runner.os }}-intel-build-${{ env.cache-name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-intel-build-${{ env.cache-name }}-
          ${{ runner.os }}-intel-build-
          ${{ runner.os }}-intel-

    - name: Install dependencies
      run:  brew install freeglut mesa harfbuzz 
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        modules: 'all'
        cache: true

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        chmod +x build_mac.sh
        MAKE_PARALLEL=$(sysctl -n hw.logicalcpu) ./build_mac.sh
        
    - name: upload mac artifact
      uses: actions/upload-artifact@v4
      with:
        name: mac-uploads
        path: sioyek-release-mac.zip

  build-mac-arm:

    runs-on: macos-14

    steps:

    - uses: actions/checkout@v4
      with:
            submodules: 'recursive'
            ref: development

    - name: Cache Homebrew packages
      uses: actions/cache@v4
      env:
        cache-name: homebrew
      with:
        path: ~/Library/Caches/Homebrew
        key: ${{ runner.os }}-arm-build-${{ env.cache-name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-arm-build-${{ env.cache-name }}-
          ${{ runner.os }}-arm-build-
          ${{ runner.os }}-arm-

    - name: Install dependencies
      run:  brew install freeglut mesa harfbuzz 
      
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        modules: 'all'
        cache: true

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        chmod +x build_mac.sh
        MAKE_PARALLEL=$(sysctl -n hw.logicalcpu) ./build_mac.sh
        mv sioyek-release-mac.zip sioyek-release-mac-arm.zip
        
    - name: upload mac artifact
      uses: actions/upload-artifact@v4
      with:
        name: mac-arm-uploads
        path: sioyek-release-mac-arm.zip
